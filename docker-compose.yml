services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: datamind
      POSTGRES_USER: datamind
      POSTGRES_PASSWORD: datamind
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datamind -d datamind"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://datamind:datamind@postgres:5432/datamind
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes:
      - upload_data:/app/uploads
      - report_data:/app/reports
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["sh", "-c", "alembic upgrade head && uvicorn main:application --host 0.0.0.0 --port 8000"]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  postgres_data:
  upload_data:
  report_data:
